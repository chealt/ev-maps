# The ev-maps Worker: serves the app's static site (packages/app/dist/client,
# built by `bun run build`) and its server-rendered pages (src/app-server.js),
# the charger tile API and the redirect from / to the
# visitor's language and country, and imports chargers into D1 on a schedule.
#
# The top level is production. [env.local] is local development (`bun run dev`
# runs `wrangler dev --env local`). Deploys pass an empty --env= so Wrangler
# knows the top level is meant. CI deploys it; to deploy by hand:
#   bunx wrangler d1 migrations apply ev-maps --remote && bunx wrangler deploy --env=
name = "ev-maps"
main = "src/index.js"
compatibility_date = "2026-11-09"
# Better Auth (src/auth.js) uses Node.js APIs such as AsyncLocalStorage.
compatibility_flags = ["nodejs_compat"]

# Production answers on both addresses. With a route listed, Wrangler would
# turn workers.dev off, so it's kept on explicitly; the pull request previews
# (<branch>-ev-maps.chealt.workers.dev) are its preview URLs. Sign-in works on
# each address: the Worker builds its callback URLs from the request's.
routes = [{ pattern = "ev.chealt.com", custom_domain = true }]
workers_dev = true
preview_urls = true

# Public: the page shows it to Google anyway. The client secret and
# BETTER_AUTH_SECRET are Worker secrets (docs/DEPLOYMENT.md); locally they're in
# .dev.vars.
[vars]
GOOGLE_CLIENT_ID = "605162380909-92ejnikf2hpgjd6hk6t17rgp1hjtauua.apps.googleusercontent.com"
# Sign-in links are sent from this address with Resend (RESEND_API_KEY secret,
# see docs/DEPLOYMENT.md).
EMAIL_FROM = "EV Maps <sign-in@chealt.com>"
# Users with a verified email at this domain see the admin area.
ADMIN_EMAIL_DOMAIN = "chealt.com"

[assets]
# The app's static files; its server-rendered pages are in ../app/dist/server
# (src/app-server.js).
directory = "../app/dist/client"
binding = "ASSETS"
# Everything else is served straight from the static assets.
# The admin pages too: the Worker only serves them to admins (src/admin.js).
run_worker_first = ["/", "/api/*", "/en/admin*", "/pl/admin*", "/hu/admin*"]

[[d1_databases]]
binding = "DB"
database_name = "ev-maps"
database_id = "b1dd75de-35c9-46f3-b2f8-14ba0463f7c4"
migrations_dir = "migrations"

# The admin area's data: errors (src/errors.js), later usage stats.
[[d1_databases]]
binding = "ADMIN_DB"
database_name = "ev-maps-admin"
database_id = "3b2fee8f-80a5-451a-9a7e-2c4355852ac5"
migrations_dir = "admin-migrations"

# CI's Playwright reports (src/test-reports.js), for admins.
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "ev-maps-test-reports"

# Rate limits for the API (src/guard.js), per IP address or signed-in user.
# Namespace IDs are the account's, so they're unusual numbers.
[[ratelimits]]
name = "TILE_LIMITER"
namespace_id = "4401"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "4402"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "STATUS_LIMITER"
namespace_id = "4403"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ROUTE_LIMITER"
namespace_id = "4404"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "USAGE_LIMITER"
namespace_id = "4410"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "ERRORS_LIMITER"
namespace_id = "4409"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "4408"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "TELEMETRY_LIMITER"
namespace_id = "4412"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "EMAIL_LIMITER"
namespace_id = "4407"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "SETTINGS_LIMITER"
namespace_id = "4405"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "FAVORITES_LIMITER"
namespace_id = "4406"
simple = { limit = 120, period = 60 }

# Each import run continues where the previous one stopped; the live
# statuses (src/live-status.js) are refreshed more often.
[triggers]
crons = ["*/15 * * * *", "*/5 * * * *"]

[observability]
enabled = true

# Local development. Environments don't inherit bindings or variables, so they
# are repeated here; the D1 binding is the same database, whose local copy
# lives in .wrangler/.
[env.local]
# Never deployed; without this it would inherit production's custom domain.
routes = []

[env.local.vars]
# The development OAuth client, with http://localhost:4321 redirect URIs.
GOOGLE_CLIENT_ID = "605162380909-9qcphon62a7gsq06974niqg20bi2b879.apps.googleusercontent.com"
# Requests reach the Worker through Astro's proxy, so it can't tell the
# site's address from them.
BETTER_AUTH_URL = "http://localhost:4321"
ADMIN_EMAIL_DOMAIN = "chealt.com"

[[env.local.d1_databases]]
binding = "DB"
database_name = "ev-maps"
database_id = "b1dd75de-35c9-46f3-b2f8-14ba0463f7c4"
migrations_dir = "migrations"

# The admin area's data: errors (src/errors.js), later usage stats.
[[env.local.d1_databases]]
binding = "ADMIN_DB"
database_name = "ev-maps-admin"
database_id = "3b2fee8f-80a5-451a-9a7e-2c4355852ac5"
migrations_dir = "admin-migrations"

# CI's Playwright reports (src/test-reports.js), for admins.
[[env.local.r2_buckets]]
binding = "REPORTS"
bucket_name = "ev-maps-test-reports"


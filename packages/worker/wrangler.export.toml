# Only for `bun run export -- --remote` (scripts/export-chargers.js): the
# production database of wrangler.toml, reached through a remote binding, so
# the export reads production while `bun run dev` keeps its local copy. It
# has no Worker code and is never deployed.
name = "ev-maps-export"
compatibility_date = "2026-11-09"

[[d1_databases]]
binding = "DB"
database_name = "ev-maps"
database_id = "b1dd75de-35c9-46f3-b2f8-14ba0463f7c4"
remote = true

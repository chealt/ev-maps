name: Dev-Config CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/dev-config/**'
      - '.github/workflows/dev-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/dev-config/**'
      - '.github/workflows/dev-config.yml'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bunx oxlint --config packages/dev-config/oxlint.json packages/dev-config

  format:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bunx oxfmt --config packages/dev-config/oxfmt.json --check packages/dev-config

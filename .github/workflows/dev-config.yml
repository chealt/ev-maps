name: Dev-Config CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/dev-config/**'
      - '.github/workflows/dev-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/dev-config/**'
      - '.github/workflows/dev-config.yml'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: packages/dev-config/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('packages/dev-config/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dev-config dependencies only
        run: cd packages/dev-config && bun install

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: packages/dev-config/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('packages/dev-config/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dev-config dependencies only
        run: cd packages/dev-config && bun install

      - name: Run lint
        run: cd packages/dev-config && bun run lint

  format:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: packages/dev-config/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('packages/dev-config/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dev-config dependencies only
        run: cd packages/dev-config && bun install

      - name: Check formatting
        run: cd packages/dev-config && bun run format:check

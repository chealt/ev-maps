name: Dev-Config

# Everything packages/dev-config needs from CI: the shared configs must be
# valid for every tool and formatted. Workspaces that use these configs run
# their own workflows on dev-config changes as well.
on:
  push:
    branches: [main]
    paths:
      - "packages/dev-config/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/dev-config.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/dev-config/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/dev-config.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/dev-config

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate tool configs
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

# Generated by packages/ai-action-configs from configs/upgrade-packages.json.
# Edit the config, not this file: the AI actions workflow regenerates it.
name: "AI: upgrade-packages"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-upgrade-packages
  cancel-in-progress: false

jobs:
  run:
    name: Run the prompt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      # --no-approve: only the prompt's model, without the repository's own pi
      # setup (.pi), and no session saved on the runner.
      - name: Run the prompt with pi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPT: "Check for outdated packages in this Bun monorepo and upgrade those whose new version was published more than a week ago. Run the lint, format check and tests after upgrading, and leave out any upgrade that breaks them."
        run: >-
          pi --print --no-session --no-approve
          --provider "anthropic" --model "claude-opus-5-5"
          "$PROMPT"

      - name: Open a pull request with the changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.AI_ACTIONS_TOKEN || github.token }}
          branch: ai/upgrade-packages
          delete-branch: true
          title: "AI: upgrade-packages"
          commit-message: "chore: upgrade-packages (AI action)"
          body: "Made by pi (anthropic/claude-opus-5-5) running packages/ai-action-configs/configs/upgrade-packages.json:\n\n> Check for outdated packages in this Bun monorepo and upgrade those whose new version was published more than a week ago. Run the lint, format check and tests after upgrading, and leave out any upgrade that breaks them."

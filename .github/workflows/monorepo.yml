name: Monorepo CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/**'
      - '.github/workflows/app.yml'
      - '.github/workflows/config.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'packages/**'
      - '.github/workflows/app.yml'
      - '.github/workflows/config.yml'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

  lint-all:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Run lint in all workspaces
        run: |
          bun run --cwd packages/config lint
          bun run --cwd packages/app lint

  format-all:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Check formatting in all workspaces
        run: |
          bun run --cwd packages/config format:check
          bun run --cwd packages/app format

  build-all:
    needs: [lint-all, format-all]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build all apps
        run: bun run build

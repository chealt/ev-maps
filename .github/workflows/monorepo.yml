name: Monorepo CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/**'
      - '.github/workflows/app.yml'
      - '.github/workflows/dev-config.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'packages/**'
      - '.github/workflows/app.yml'
      - '.github/workflows/dev-config.yml'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

  lint-all:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run lint in all workspaces
        run: |
          bunx oxlint --config packages/dev-config/oxlint.json packages/dev-config
          bunx oxlint --config packages/dev-config/oxlint.json packages/app

  format-all:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check formatting in all workspaces
        run: |
          bunx oxfmt --config packages/dev-config/oxfmt.json --check packages/dev-config
          bunx oxfmt --config packages/dev-config/oxfmt.json --check packages/app

  build-all:
    needs: [lint-all, format-all]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build all apps
        run: bun run build

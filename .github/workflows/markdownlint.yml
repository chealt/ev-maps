name: Markdown Lint

# Root documentation (README, docs/) does not belong to a workspace.
on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "packages/dev-config/.rumdl.toml"
      - "packages/dev-config/.oxfmtrc.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/markdownlint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - "packages/dev-config/.rumdl.toml"
      - "packages/dev-config/.oxfmtrc.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/markdownlint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint Markdown
        run: bun run lint:md

      - name: Check Markdown formatting
        run: bun run format:md:check

# Generated by packages/ai-action-configs from configs/security-audit.json.
# Edit the config, not this file: the AI actions workflow regenerates it.
name: "AI: security-audit"

on:
  schedule:
    - cron: "28 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-security-audit
  cancel-in-progress: false

jobs:
  run:
    name: Run the prompt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AI_ACTIONS_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      # The model through Radius, with the organization's key, and only the
      # prompt's model (--no-approve). pi writes its findings to FINDINGS, and
      # its final message goes to the job's summary.
      - name: Run the prompt with pi
        shell: bash
        env:
          RADIUS_API_KEY: ${{ secrets.RADIUS_API_KEY }}
          FINDINGS: ${{ runner.temp }}/findings.json
          PROMPT: "Audit this repository for security problems: secrets or keys committed in code or config; injection (SQL in the Worker's D1 queries, HTML, URLs, shell); authentication, sessions and passkeys; authorisation of the Worker's and the admin's endpoints; CORS, cookies and security headers; what's trusted from the client or third-party APIs; GitHub Actions workflows (untrusted input in run steps, pull_request_target, token permissions, unpinned third-party actions); and dependencies with known vulnerabilities (bun audit). Report only real, specific problems you can point to in the code, not general advice."
          FINDINGS_INSTRUCTION: "Don't change the repository's files. Write what you found to the JSON file at the path in the FINDINGS environment variable: an array with an object per problem, with the string fields id, title and body. The id is a short slug of lowercase letters, digits and dashes (e.g. cors-wildcard-worker), and the title names the problem in a short sentence; keep both the same each time you find it: they're how a problem being fixed already is recognised. The body, in Markdown, says where it is (files and lines), why it's a problem, how it could be exploited or go wrong, and how to fix it. Write an empty array if you found nothing. Your final message is the job's summary: what you checked and what you found."
        run: >-
          pi --print --no-session --no-approve
          --provider radius --model "claude-opus-5-5"
          "$PROMPT"$'\n\n'"$FINDINGS_INSTRUCTION"
          | tee -a "$GITHUB_STEP_SUMMARY"

      # A pull request per finding no open one fixes already (its branch,
      # ai/security-audit/{id}, or its title), pi fixing it on a fresh branch.
      - name: Fix the findings in pull requests
        shell: bash
        env:
          RADIUS_API_KEY: ${{ secrets.RADIUS_API_KEY }}
          GH_TOKEN: ${{ secrets.AI_ACTIONS_TOKEN || github.token }}
          NAME: "security-audit"
          PREFIX: "Security"
          LIMIT: "3"
          LABELS: "security"
          PROVIDER: "radius"
          MODEL: "claude-opus-5-5"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun packages/ai-action-configs/scripts/fix-findings.js "$RUNNER_TEMP/findings.json" | tee -a "$GITHUB_STEP_SUMMARY"

# Generated by packages/ai-action-configs from configs/security-audit.json.
# Edit the config, not this file: the AI actions workflow regenerates it.
name: "AI: security-audit"

on:
  schedule:
    - cron: "28 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-security-audit
  cancel-in-progress: false

jobs:
  run:
    name: Run the prompt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      # The model through Radius, with the organization's key, and only the
      # prompt's model (--no-approve). pi writes its findings to FINDINGS, and
      # its final message goes to the job's summary.
      - name: Run the prompt with pi
        shell: bash
        env:
          RADIUS_API_KEY: ${{ secrets.RADIUS_API_KEY }}
          FINDINGS: ${{ runner.temp }}/findings.json
          PROMPT: "Audit this repository for security problems: secrets or keys committed in code or config; injection (SQL in the Worker's D1 queries, HTML, URLs, shell); authentication, sessions and passkeys; authorisation of the Worker's and the admin's endpoints; CORS, cookies and security headers; what's trusted from the client or third-party APIs; GitHub Actions workflows (untrusted input in run steps, pull_request_target, token permissions, unpinned third-party actions); and dependencies with known vulnerabilities (bun audit). Report only real, specific problems you can point to in the code, not general advice."
          FINDINGS_INSTRUCTION: "Don't change the repository's files. Write what you found to the JSON file at the path in the FINDINGS environment variable: an array with an object per problem, { \"title\": \"…\", \"body\": \"…\" }. The title names the problem in a short sentence, the same each time you find it: it's how a problem filed already is recognised. The body, in Markdown, says where it is (files and lines), why it's a problem, how it could be exploited or go wrong, and how to fix it. Write an empty array if you found nothing. Your final message is the job's summary: what you checked and what you found."
        run: >-
          pi --print --no-session --no-approve
          --provider radius --model "claude-opus-5-5"
          "$PROMPT"$'\n\n'"$FINDINGS_INSTRUCTION"
          | tee -a "$GITHUB_STEP_SUMMARY"

      # An issue per new finding; one whose title an issue has, open or
      # closed, was filed already.
      - name: File the findings as issues
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AI_ACTIONS_TOKEN || github.token }}
          LABELS: "security"
          PRIORITY: "High"
          FOOTER: "Found by pi (radius/claude-opus-5-5) running packages/ai-action-configs/configs/security-audit.json."
        run: >-
          bun packages/ai-action-configs/scripts/file-issues.js "$RUNNER_TEMP/findings.json"
          | tee -a "$GITHUB_STEP_SUMMARY"

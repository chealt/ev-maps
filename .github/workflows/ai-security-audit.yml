# Generated by packages/ai-action-configs from configs/security-audit.json.
# Edit the config, not this file: the AI actions workflow regenerates it.
name: "AI: security-audit"

on:
  schedule:
    - cron: "28 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-security-audit
  cancel-in-progress: false

jobs:
  run:
    name: Run the prompt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      # The model through Radius, with only the prompt's model (--no-approve).
      - name: Fix one problem with pi
        shell: bash
        env:
          RADIUS_API_KEY: ${{ secrets.RADIUS_API_KEY }}
          GH_TOKEN: ${{ secrets.AI_ACTIONS_TOKEN || github.token }}
          PROMPT: "Audit this repository for security problems: secrets or keys committed in code or config; injection (SQL in the Worker's D1 queries, HTML, URLs, shell); authentication, sessions and passkeys; authorisation of the Worker's and the admin's endpoints; CORS, cookies and security headers; what's trusted from the client or third-party APIs; GitHub Actions workflows (untrusted input in run steps, pull_request_target, token permissions, unpinned third-party actions); and dependencies with known vulnerabilities (bun audit). Only real, specific problems you can point to in the code count, not general advice."
          FIX_INSTRUCTION: "Fix one problem a run, the most serious one that no open pull request fixes yet: before you change anything, list the open pull requests (`gh pr list --state open`) and read any that might fix it (`gh pr view`, `gh pr diff`). Keep the change as small as the fix allows, follow the repository's guidelines, add or update the tests of what you change, and run them, the lint and the format check. Don't commit. If there's nothing left to fix, change nothing. Your final message becomes the pull request: its first line is the title, a short sentence naming the problem, with no prefix; the rest, in Markdown for its reviewer, is the description: where the problem was, why it's a problem, what you changed and how you checked it. If you changed nothing, say why."
        run: >-
          pi --print --no-session --no-approve
          --provider radius --model "claude-opus-5-5"
          "$PROMPT"$'\n\n'"$FIX_INSTRUCTION"
          | tee "$RUNNER_TEMP/pi-report.md"

      # The report's first line is the title, the rest the description.
      - name: Write the pull request's title and description
        id: report
        shell: bash
        run: |
          title=$(grep -m1 -v '^[[:space:]]*$' "$RUNNER_TEMP/pi-report.md" | sed 's/^#* *//')
          echo "title=${title:0:200}" >> "$GITHUB_OUTPUT"
          awk 'found { print } !found && NF { found = 1 }' "$RUNNER_TEMP/pi-report.md" \
            > "$RUNNER_TEMP/pull-request-body.md"

      - name: Open a pull request with the fix
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AI_ACTIONS_TOKEN || github.token }}
          branch: ai/security-audit/${{ github.run_id }}
          delete-branch: true
          title: "Security: ${{ steps.report.outputs.title }}"
          commit-message: "fix: ${{ steps.report.outputs.title }}"
          body-path: ${{ runner.temp }}/pull-request-body.md
          labels: "security"

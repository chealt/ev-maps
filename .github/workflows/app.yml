name: App

# Everything packages/app needs from CI, plus deploying it with the Worker
# that serves it (packages/worker, checked in worker.yml). It runs for every
# push and pull request so the required checks always report. When nothing the
# app or the Worker depends on changed (e.g. docs-only changes), the checks
# skip their steps and pass in seconds, and nothing is deployed.
#
# Runs started by hand or by refresh.yml (workflow_dispatch) check, build and
# deploy everything; on main, that rebuilds the country pages from the latest
# chargers and deploys them to production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer commit on a pull request makes older runs pointless, so cancel them.
# Never cancel runs on main: a cancelled run would skip its deploy, and if the
# next push doesn't change the app, that change would never reach production.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: packages/app

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'

      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          # The app, everything it depends on, and the Worker it's deployed
          # with.
          filters: |
            app:
              - "packages/app/**"
              - "packages/tiles/**"
              - "packages/ui/**"
              - "packages/worker/**"
              - "packages/dev-config/**"
              - "packages/biome-plugin-css-units/**"
              - "package.json"
              - "bun.lock"
              - ".gitignore"
              - ".github/workflows/app.yml"

  check:
    needs: changes
    if: ${{ !cancelled() }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint JavaScript
            package: app
            script: lint
          - name: Lint CSS
            package: app
            script: lint:css
          - name: Check formatting
            package: app
            script: format:check
          - name: Lint tiles
            package: tiles
            script: lint
          - name: Check tiles formatting
            package: tiles
            script: format:check
          - name: Lint UI components
            package: ui
            script: lint
          - name: Lint UI components' CSS
            package: ui
            script: lint:css
          - name: Check UI components formatting
            package: ui
            script: format:check
    steps:
      # A skipped check counts as passed, so fail if change detection failed.
      - name: Check change detection
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection failed."
          exit 1

      - name: Nothing to check
        if: needs.changes.outputs.app != 'true'
        working-directory: .
        run: echo "No app changes; skipping." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: needs.changes.outputs.app == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.app == 'true'
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: needs.changes.outputs.app == 'true'
        run: bun install --frozen-lockfile

      - name: ${{ matrix.name }}
        if: needs.changes.outputs.app == 'true'
        working-directory: packages/${{ matrix.package }}
        run: bun run ${{ matrix.script }}

  build:
    needs: changes
    if: ${{ !cancelled() }}
    name: Build
    runs-on: ubuntu-latest
    steps:
      # A skipped check counts as passed, so fail if change detection failed.
      - name: Check change detection
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection failed."
          exit 1

      - name: Nothing to check
        if: needs.changes.outputs.app != 'true'
        working-directory: .
        run: echo "No app changes; skipping." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: needs.changes.outputs.app == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.app == 'true'
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: needs.changes.outputs.app == 'true'
        run: bun install --frozen-lockfile

      # The site builds without these, but then has no map, a demo map style
      # or no sign-in. Pull requests from forks are exempt because
      # GitHub doesn't give them secrets or variables.
      - name: Check required secrets and variables
        if: ${{ needs.changes.outputs.app == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
        run: |
          missing=0
          for name in VITE_GOOGLE_MAPS_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name repository secret."
              missing=1
            fi
          done
          for name in VITE_GOOGLE_MAPS_MAP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name repository variable."
              missing=1
            fi
          done
          exit $missing

      # The country pages are built from the chargers in the production
      # database. Pull requests from forks don't get the Cloudflare secrets,
      # so they build without country pages.
      # The export runs on Node: Wrangler's remote bindings don't work under
      # Bun. The version comes from engines.node in the root package.json.
      - uses: actions/setup-node@v7
        if: ${{ needs.changes.outputs.app == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          node-version-file: package.json

      - name: Export chargers for the country pages
        if: ${{ needs.changes.outputs.app == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run export -- --remote --out ../app/data/chargers

      - name: Build
        if: needs.changes.outputs.app == 'true'
        run: bun run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}

      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.app == 'true'
        with:
          name: ev-maps-dist
          path: packages/app/dist

  # The Playwright tests, split into shards that run in parallel. Each
  # uploads a blob report; the Test job merges them into one HTML report.
  test-shard:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.app == 'true' }}
    name: Test shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The browser is cached per Playwright version (~/.cache/ms-playwright);
      # the system libraries it needs aren't, so a cache hit installs only
      # those.
      - name: Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright browser's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run tests
        run: bun run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: packages/app/blob-report
          retention-days: 1

  # The required check: it passes only if every shard did (or nothing in the
  # app changed), and merges the shards' reports into one.
  test:
    needs: [changes, test-shard]
    if: ${{ !cancelled() }}
    name: Test
    runs-on: ubuntu-latest
    # Where the published reports are, for the release notes.
    outputs:
      report-url: ${{ steps.publish.outputs.report-url }}
      a11y-report-url: ${{ steps.publish.outputs.a11y-report-url }}
      summary: ${{ steps.publish.outputs.summary }}
      a11y-summary: ${{ steps.publish.outputs.a11y-summary }}
    steps:
      # A skipped check counts as passed, so fail if change detection failed.
      - name: Check change detection
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection failed."
          exit 1

      - name: Nothing to check
        if: needs.changes.outputs.app != 'true'
        working-directory: .
        run: echo "No app changes; skipping." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: needs.changes.outputs.app == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.app == 'true'
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: needs.changes.outputs.app == 'true'
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.app == 'true'
        with:
          pattern: blob-report-*
          path: packages/app/all-blob-reports
          merge-multiple: true

      # The HTML report and the JSON summary, as one run would have made them.
      - name: Merge the shards' reports
        if: needs.changes.outputs.app == 'true'
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: bunx playwright merge-reports --reporter html,json all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: needs.changes.outputs.app == 'true'
        with:
          name: playwright-report
          path: packages/app/playwright-report
          retention-days: 14

      # The report in the admin area (R2, only for admins), linked from a
      # commit status. Pull requests from forks don't get the secrets.
      - name: Publish Playwright report
        id: publish
        if: ${{ needs.changes.outputs.app == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_URL: https://ev.chealt.com
        run: bun scripts/publish-test-report.js

      - name: Check the shards passed
        if: needs.changes.outputs.app == 'true' && needs.test-shard.result != 'success'
        working-directory: .
        run: |
          echo "::error::Some tests failed: see the Playwright report."
          exit 1

  # Deploys the tested build with the ev-maps Cloudflare Worker (static assets
  # plus the API, see packages/worker/wrangler.toml): production for pushes to
  # main and runs started on main, a preview version with its own URL for pull
  # requests. Pull requests from forks are skipped because they don't get the
  # Cloudflare secrets, and so are runs started on other branches.
  deploy:
    name: Deploy
    needs: [changes, check, build, test]
    if: needs.changes.outputs.app == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name != 'pull_request' && 'production' || 'preview' }}
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Check Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Installs the pinned wrangler from packages/worker/package.json.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: ev-maps-dist
          path: packages/app/dist

      # Production only: previews share the database, so a pull request
      # mustn't change its schema before it's merged.
      - name: Apply database migrations
        if: github.event_name != 'pull_request'
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler d1 migrations apply ev-maps --remote
          bunx wrangler d1 migrations apply ev-maps-admin --remote

      # Preview URLs need a DNS-safe alias: "feat/My_Branch" -> "feat-my-branch".
      - name: Preview alias
        id: alias
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | cut -c1-40 | sed -E 's/^-+|-+$//g')
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          workingDirectory: packages/worker
          # --env= is wrangler.toml's top level (production), not [env.local].
          command: ${{ github.event_name != 'pull_request' && 'deploy --env=' || format('versions upload --env= --preview-alias {0}', steps.alias.outputs.alias) }}

      - name: Deployment URL
        id: url
        env:
          OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          url=$(printf '%s\n' "$OUTPUT" | sed -n 's/.*Preview Alias URL: \(https:[^ ]*\).*/\1/p' | head -1)
          if [ -z "$url" ]; then
            url=$(printf '%s\n' "$OUTPUT" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      # Google sign-in only works on origins listed on the OAuth client, and
      # those can't contain wildcards. So pull requests are also uploaded to a
      # fixed "preview" alias that can be authorized once. The most recently
      # deployed pull request wins.
      - name: Update the shared preview
        id: shared-preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          workingDirectory: packages/worker
          command: versions upload --env= --preview-alias preview

      - name: Shared preview URL
        if: github.event_name == 'pull_request'
        env:
          OUTPUT: ${{ steps.shared-preview.outputs.command-output }}
        run: |
          url=$(printf '%s\n' "$OUTPUT" | sed -n 's/.*Preview Alias URL: \(https:[^ ]*\).*/\1/p' | head -1)
          echo "Shared preview (sign-in works here): $url" >> "$GITHUB_STEP_SUMMARY"

  # Each production deploy gets a GitHub release, tagged with the date and
  # time it went out, with notes listing the pull requests merged since the
  # previous release (scripts/release-notes.js).
  release:
    name: Release
    needs: [test, deploy]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and the tags, to find the previous release.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Test the release notes script
        run: bun test scripts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_URL: ${{ needs.test.outputs.report-url }}
          A11Y_REPORT_URL: ${{ needs.test.outputs.a11y-report-url }}
          SUMMARY: ${{ needs.test.outputs.summary }}
          A11Y_SUMMARY: ${{ needs.test.outputs.a11y-summary }}
        run: |
          previous=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          tag="v$(date -u +%Y.%m.%d-%H%M)"
          bun scripts/release-notes.js $previous > notes.md
          # The reports of the tests this release passed (admins only).
          if [ -n "$REPORT_URL" ]; then
            printf '\n## Test reports\n\n- [Playwright report](%s): %s\n- [Accessibility report](%s): %s\n' \
              "$REPORT_URL" "$SUMMARY" "$A11Y_REPORT_URL" "$A11Y_SUMMARY" >> notes.md
          fi
          if [ -n "$previous" ]; then
            printf '\n**Full changes:** %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$tag" >> notes.md
          fi
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "$(date -u '+%B %-d, %Y, %H:%M UTC')" --notes-file notes.md
          echo "Released $tag" >> "$GITHUB_STEP_SUMMARY"

name: App

on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - '.github/workflows/app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/app/**'
      - '.github/workflows/app.yml'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Bun installation
        uses: actions/cache@v3
        id: bun-cache
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('.github/workflows/app.yml') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: packages/app/node_modules
          key: ${{ runner.os }}-bun-deps-${{ hashFiles('packages/app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-deps-

      - name: Install app dependencies only
        run: cd packages/app && bun install

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Bun installation
        uses: actions/cache@v3
        id: bun-cache
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('.github/workflows/app.yml') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: packages/app/node_modules
          key: ${{ runner.os }}-bun-deps-${{ hashFiles('packages/app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-deps-

      - name: Install app dependencies only
        run: cd packages/app && bun install

      - name: Run lint
        run: cd packages/app && bun run lint

  lint-css:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Bun installation
        uses: actions/cache@v3
        id: bun-cache
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('.github/workflows/app.yml') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: packages/app/node_modules
          key: ${{ runner.os }}-bun-deps-${{ hashFiles('packages/app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-deps-

      - name: Install app dependencies only
        run: cd packages/app && bun install

      - name: Run CSS lint with biome
        run: cd packages/app && bun run lint:css

      - name: Check for hardcoded CSS values
        run: |
          # Check for hardcoded hex colors in component CSS (excluding global.css where variables are defined)
          if grep -r "#[0-9a-f]\{3,8\}" packages/app/src/components/ --include="*.css" 2>/dev/null; then
            echo "::error::Hardcoded hex colors found in component CSS. Use CSS variables from global.css instead."
            exit 1
          fi
          # Check for hardcoded px/rem values in component CSS
          if grep -rE "[0-9]+(px|rem)" packages/app/src/components/ --include="*.css" 2>/dev/null; then
            echo "::error::Hardcoded px/rem values found in component CSS. Use CSS variables from global.css instead."
            exit 1
          fi

  format:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Bun installation
        uses: actions/cache@v3
        id: bun-cache
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('.github/workflows/app.yml') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: packages/app/node_modules
          key: ${{ runner.os }}-bun-deps-${{ hashFiles('packages/app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-deps-

      - name: Install app dependencies only
        run: cd packages/app && bun install

      - name: Check formatting
        run: cd packages/app && bun run format

  markdownlint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install markdownlint
        run: bun add -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint README.md
          markdownlint docs/DEVELOPMENT_GUIDELINES.md

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Bun installation
        uses: actions/cache@v3
        id: bun-cache
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('.github/workflows/app.yml') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: packages/app/node_modules
          key: ${{ runner.os }}-bun-deps-${{ hashFiles('packages/app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-deps-

      - name: Install app dependencies only
        run: cd packages/app && bun install

      - name: Build app
        run: cd packages/app && bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ev-maps-dist
          path: packages/app/dist

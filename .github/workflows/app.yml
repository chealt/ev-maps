name: App

# Everything packages/app needs from CI. Runs when the app or anything it
# depends on changes: shared tool configs, root tooling and the lockfile.
on:
  push:
    branches: [main]
    paths:
      - "packages/app/**"
      - "packages/dev-config/**"
      - "packages/biome-plugin-css-units/**"
      - "package.json"
      - "bun.lock"
      - ".gitignore"
      - ".github/workflows/app.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/app/**"
      - "packages/dev-config/**"
      - "packages/biome-plugin-css-units/**"
      - "package.json"
      - "bun.lock"
      - ".gitignore"
      - ".github/workflows/app.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/app

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint JavaScript
            script: lint
          - name: Lint CSS
            script: lint:css
          - name: Check formatting
            script: format:check
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ${{ matrix.name }}
        run: bun run ${{ matrix.script }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: ev-maps-dist
          path: packages/app/dist

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/app/playwright-report
          retention-days: 14

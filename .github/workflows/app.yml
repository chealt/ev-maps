name: App

# Everything packages/app needs from CI. It runs for every push and pull
# request so the required checks always report. When nothing the app depends
# on changed (e.g. docs-only changes), the checks skip their steps and pass in
# seconds, and nothing is deployed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer commit on a pull request makes older runs pointless, so cancel them.
# Never cancel runs on main: a cancelled run would skip its deploy, and if the
# next push doesn't change the app, that change would never reach production.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: packages/app

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # The app and everything it depends on.
          filters: |
            app:
              - "packages/app/**"
              - "packages/dev-config/**"
              - "packages/biome-plugin-css-units/**"
              - "package.json"
              - "bun.lock"
              - ".gitignore"
              - ".github/workflows/app.yml"

  check:
    needs: changes
    if: ${{ !cancelled() }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint JavaScript
            script: lint
          - name: Lint CSS
            script: lint:css
          - name: Check formatting
            script: format:check
    steps:
      # A skipped check counts as passed, so fail if change detection failed.
      - name: Check change detection
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection failed."
          exit 1

      - name: Nothing to check
        if: needs.changes.outputs.app != 'true'
        working-directory: .
        run: echo "No app changes; skipping." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: needs.changes.outputs.app == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.app == 'true'
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: needs.changes.outputs.app == 'true'
        run: bun install --frozen-lockfile

      - name: ${{ matrix.name }}
        if: needs.changes.outputs.app == 'true'
        run: bun run ${{ matrix.script }}

  build:
    needs: changes
    if: ${{ !cancelled() }}
    name: Build
    runs-on: ubuntu-latest
    steps:
      # A skipped check counts as passed, so fail if change detection failed.
      - name: Check change detection
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection failed."
          exit 1

      - name: Nothing to check
        if: needs.changes.outputs.app != 'true'
        working-directory: .
        run: echo "No app changes; skipping." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: needs.changes.outputs.app == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.app == 'true'
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: needs.changes.outputs.app == 'true'
        run: bun install --frozen-lockfile

      # The site builds without these, but then has no map, no chargers, a demo
      # map style or no sign-in. Pull requests from forks are exempt because
      # GitHub doesn't give them secrets or variables.
      - name: Check required secrets and variables
        if: ${{ needs.changes.outputs.app == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_OPEN_CHARGE_MAP_API_KEY: ${{ secrets.VITE_OPEN_CHARGE_MAP_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          missing=0
          for name in VITE_GOOGLE_MAPS_API_KEY VITE_OPEN_CHARGE_MAP_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name repository secret."
              missing=1
            fi
          done
          for name in VITE_GOOGLE_MAPS_MAP_ID VITE_GOOGLE_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name repository variable."
              missing=1
            fi
          done
          exit $missing

      - name: Build
        if: needs.changes.outputs.app == 'true'
        run: bun run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_OPEN_CHARGE_MAP_API_KEY: ${{ secrets.VITE_OPEN_CHARGE_MAP_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.app == 'true'
        with:
          name: ev-maps-dist
          path: packages/app/dist

  test:
    needs: changes
    if: ${{ !cancelled() }}
    name: Test
    runs-on: ubuntu-latest
    steps:
      # A skipped check counts as passed, so fail if change detection failed.
      - name: Check change detection
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection failed."
          exit 1

      - name: Nothing to check
        if: needs.changes.outputs.app != 'true'
        working-directory: .
        run: echo "No app changes; skipping." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: needs.changes.outputs.app == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.app == 'true'
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: needs.changes.outputs.app == 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        if: needs.changes.outputs.app == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        if: needs.changes.outputs.app == 'true'
        run: bun run test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ needs.changes.outputs.app == 'true' && (!cancelled()) }}
        with:
          name: playwright-report
          path: packages/app/playwright-report
          retention-days: 14

  # Deploys the tested build to the ev-maps Cloudflare Worker (static assets,
  # see packages/app/wrangler.toml): production for pushes to main, a preview
  # version with its own URL for pull requests. Pull requests from forks are
  # skipped because they don't get the Cloudflare secrets.
  deploy:
    name: Deploy
    needs: [changes, check, build, test]
    if: needs.changes.outputs.app == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Check Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Installs the pinned wrangler from packages/app/package.json.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: ev-maps-dist
          path: packages/app/dist

      # Preview URLs need a DNS-safe alias: "feat/My_Branch" -> "feat-my-branch".
      - name: Preview alias
        id: alias
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | cut -c1-40 | sed -E 's/^-+|-+$//g')
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          workingDirectory: packages/app
          command: ${{ github.event_name == 'push' && 'deploy' || format('versions upload --preview-alias {0}', steps.alias.outputs.alias) }}

      - name: Deployment URL
        id: url
        env:
          OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          url=$(printf '%s\n' "$OUTPUT" | sed -n 's/.*Preview Alias URL: \(https:[^ ]*\).*/\1/p' | head -1)
          if [ -z "$url" ]; then
            url=$(printf '%s\n' "$OUTPUT" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      # Google sign-in only works on origins listed on the OAuth client, and
      # those can't contain wildcards. So pull requests are also uploaded to a
      # fixed "preview" alias that can be authorized once. The most recently
      # deployed pull request wins.
      - name: Update the shared preview
        id: shared-preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          workingDirectory: packages/app
          command: versions upload --preview-alias preview

      - name: Shared preview URL
        if: github.event_name == 'pull_request'
        env:
          OUTPUT: ${{ steps.shared-preview.outputs.command-output }}
        run: |
          url=$(printf '%s\n' "$OUTPUT" | sed -n 's/.*Preview Alias URL: \(https:[^ ]*\).*/\1/p' | head -1)
          echo "Shared preview (sign-in works here): $url" >> "$GITHUB_STEP_SUMMARY"

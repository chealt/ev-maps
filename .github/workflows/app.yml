name: App CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/config/**'
      - '.github/workflows/app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/config/**'
      - '.github/workflows/app.yml'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Run lint
        run: bun run --cwd packages/app lint

  format:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Check formatting
        run: bun run --cwd packages/app format

  build:
    needs: [lint, format]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build app
        run: bun run --cwd packages/app build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ev-maps-app-dist
          path: packages/app/dist

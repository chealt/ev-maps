name: App

# Everything packages/app needs from CI. Runs when the app or anything it
# depends on changes: shared tool configs, root tooling and the lockfile.
on:
  push:
    branches: [main]
    paths:
      - "packages/app/**"
      - "packages/dev-config/**"
      - "package.json"
      - "bun.lock"
      - ".gitignore"
      - ".github/workflows/app.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/app/**"
      - "packages/dev-config/**"
      - "package.json"
      - "bun.lock"
      - ".gitignore"
      - ".github/workflows/app.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint JavaScript
        run: bun run lint

      - name: Lint CSS
        run: bun run lint:css

      - name: Check for hardcoded CSS values
        run: |
          # Design tokens live in global.css; component CSS must use variables.
          if grep -rnE "#[0-9a-fA-F]{3,8}\b|[0-9.]+(px|rem)\b" src/components --include="*.css"; then
            echo "::error::Hardcoded colors or px/rem values found in component CSS. Use CSS variables from global.css instead."
            exit 1
          fi

      - name: Check formatting
        run: bun run format:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: ev-maps-dist
          path: packages/app/dist

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: packages/app/test-results

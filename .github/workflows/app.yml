name: App CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - '.github/workflows/app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/app/**'
      - '.github/workflows/app.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install app dependencies only
        run: cd packages/app && bun install

      - name: Run lint
        run: cd packages/app && bun run lint

      - name: Check formatting
        run: cd packages/app && bun run format

      - name: Build app
        run: cd packages/app && bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ev-maps-dist
          path: packages/app/dist

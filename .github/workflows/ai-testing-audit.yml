# Generated by packages/ai-action-configs from configs/testing-audit.json.
# Edit the config, not this file: the AI actions workflow regenerates it.
name: "AI: testing-audit"

on:
  schedule:
    - cron: "26 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-testing-audit
  cancel-in-progress: false

jobs:
  run:
    name: Run the prompt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      # --no-approve: only the prompt's model, without the repository's own pi
      # setup (.pi), and no session saved on the runner. pi's final message,
      # its report of what it did, is kept for the pull request's description
      # (bash: pipefail, so a failing pi still fails the step).
      - name: Run the prompt with pi
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPT: "Audit E2E and unit tests and identify potentially misplaced tests that could be sped up by moving from E2E to quick unit tests instead. Audit unit test that they are fast and don't share state or use real clocks."
          REPORT_INSTRUCTION: "Your final message becomes the description of the pull request with your changes, so write it in Markdown for its reviewer: what you changed and why (for an upgrade, each package or tool with the version it went from and to), and what you checked but left alone, and why. If you changed nothing, say why."
        run: >-
          pi --print --no-session --no-approve
          --provider "anthropic" --model "claude-opus-5-5"
          "$PROMPT"$'\n\n'"$REPORT_INSTRUCTION"
          | tee "$RUNNER_TEMP/pi-report.md"

      - name: Write the pull request's description
        shell: bash
        env:
          HEADER: "Made by pi (anthropic/claude-opus-5-5) running packages/ai-action-configs/configs/testing-audit.json:"
          PROMPT: "Audit E2E and unit tests and identify potentially misplaced tests that could be sped up by moving from E2E to quick unit tests instead. Audit unit test that they are fast and don't share state or use real clocks."
        run: |
          {
            printf '%s\n\n' "$HEADER"
            printf '%s\n' "$PROMPT" | sed 's/^/> /'
            printf '\n---\n\n'
            cat "$RUNNER_TEMP/pi-report.md"
          } > "$RUNNER_TEMP/pull-request-body.md"

      - name: Open a pull request with the changes
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AI_ACTIONS_TOKEN || github.token }}
          branch: ai/testing-audit
          delete-branch: true
          title: "AI: testing-audit"
          commit-message: "chore: testing-audit (AI action)"
          body-path: ${{ runner.temp }}/pull-request-body.md
